  physics: { solver: 'forceAtlas2Based', forceAtlas2Based: { gravitationalConstant: -40, centralGravity: 0.005, springLength: 180, springConstant: 0.02 } },

  nodes: { font: { color: '#e8e0d0', size: 11 }, size: 14 },
