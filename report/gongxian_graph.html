<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>珙县领导班子工作关系网络</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.6/vis-network.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0d0d0d;color:#ddd;font-family:'Noto Serif SC','SimSun',serif;overflow:hidden}
#app{display:flex;height:100vh;width:100%}
#sidebar{width:340px;min-width:340px;padding:20px;overflow-y:auto;background:#141414;border-right:1px solid #222}
#sidebar h1{font-size:15px;color:#E03C31;margin:0 0 2px;font-weight:700;letter-spacing:1px}
#sidebar .sub{font-size:11px;color:#555;margin-bottom:8px}
#graph{flex:1;min-width:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:10px}
.stat{background:#111;padding:6px;border:1px solid #222;text-align:center}
.stat-num{font-size:16px;font-weight:700;color:#c9a94e}
.stat-lbl{font-size:10px;color:#555}
h2{font-size:12px;color:#c9a94e;margin:10px 0 6px;border-bottom:1px solid #222;padding-bottom:3px}
.legend{display:flex;align-items:center;gap:6px;font-size:11px;color:#666;margin-bottom:2px}
.ldot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.lsq{width:10px;height:10px;border-radius:1px;flex-shrink:0}
.gap-box{margin-top:10px;padding:8px;background:#1a0a0a;border:1px solid #3a1a1a;font-size:10px;color:#c96;line-height:1.6}
.gap-box strong{color:#E03C31}
</style>
</head>
<body>
<div id="app">
<div id="sidebar">
<h1>珙县 领导班子</h1>
<div class="sub">四川省 · 宜宾市 · 数据截至 2026-07</div>
<div class="stats">
<div class="stat"><div class="stat-num" id="nodeCount">0</div><div class="stat-lbl">节点</div></div>
<div class="stat"><div class="stat-num" id="personCount">0</div><div class="stat-lbl">人物</div></div>
</div>
<div class="stats">
<div class="stat"><div class="stat-num" id="edgeCount">0</div><div class="stat-lbl">连线</div></div>
<div class="stat"><div class="stat-num" id="orgCount">0</div><div class="stat-lbl">机构</div></div>
</div>
<h2>图例</h2>
<div class="legend"><div class="ldot" style="background:#c7a7a0"></div>县委书记</div>
<div class="legend"><div class="ldot" style="background:#3264c8"></div>县长</div>
<div class="legend"><div class="ldot" style="background:#6478f0"></div>县委常委</div>
<div class="legend"><div class="ldot" style="background:#64b4f0"></div>副县长/党组成员</div>
<div class="legend"><div class="ldot" style="background:#c89032"></div>原任/前任</div>
<div class="legend"><div class="ldot" style="background:#888"></div>其他人员</div>
<div class="legend"><div class="lsq" style="background:#444;border:1px solid #666"></div>机构部门</div>
<div class="legend"><div style="width:18px;height:2px;background:#c9a94e;flex-shrink:0"></div>工作关系</div>
<h2>操作</h2>
<div style="font-size:10px;color:#555;line-height:1.8">悬停查看详情<br>拖拽调整布局<br>滚轮缩放</div>
<div class="gap-box">
<strong>待查缺口</strong><br>
县纪委书记·组织部部长·县委办主任<br>沙之杰前职·侯杰履历·罗道戡履历
</div>
</div>
<div id="graph"></div>
</div>
<script>
var persons = [
{id:1,n:'沙之杰',t:'县委书记',b:'',bp:''},
{id:2,n:'高果',t:'县委副书记、县长',b:'1978.06',bp:''},
{id:3,n:'侯杰',t:'县委专职副书记',b:'',bp:''},
{id:4,n:'杨杰',t:'县委常委、政法委书记',b:'',bp:''},
{id:5,n:'赵静',t:'县委常委、宣传部部长',b:'',bp:''},
{id:6,n:'胡正元',t:'县委常委、统战部部长、经开区党工委书记',b:'',bp:''},
{id:7,n:'龚勋',t:'（原）县委常委、常务副县长',b:'',bp:''},
{id:8,n:'谢建文',t:'副县长',b:'1988.07',bp:'四川南溪'},
{id:9,n:'贾泽鑫',t:'副县长（兼巡场镇党委书记）',b:'1978.02',bp:''},
{id:10,n:'李文举',t:'副县长、县公安局局长',b:'',bp:''},
{id:11,n:'严宏',t:'县人大常委会主任',b:'',bp:''},
{id:12,n:'李智',t:'县政协主席',b:'',bp:''},
{id:15,n:'罗道戡',t:'县委常委、常务副县长',b:'',bp:''},
{id:19,n:'杨勇',t:'原县委常委、宣传部部长',b:'',bp:''},
{id:20,n:'何银波',t:'副县长',b:'',bp:''},
{id:21,n:'陈欣',t:'副县长',b:'',bp:''},
{id:22,n:'黎熙',t:'县委常委、县人武部部长',b:'',bp:''},
{id:23,n:'王小阳',t:'县人大常委会副主任',b:'',bp:''},
{id:24,n:'吴开友',t:'县人大常委会副主任',b:'',bp:''},
{id:25,n:'何丽英',t:'县人大常委会副主任',b:'',bp:''},
{id:26,n:'熊宗炳',t:'县政协副主席',b:'',bp:''},
{id:27,n:'王刚勤',t:'县政协副主席',b:'',bp:''},
{id:28,n:'何叶',t:'县政协副主席',b:'',bp:''},
{id:29,n:'刘晓博',t:'副县长',b:'',bp:''},
{id:30,n:'张莉',t:'县委常委（职务待查）',b:'',bp:''},
{id:31,n:'谢国刚',t:'县委常委（职务待查）',b:'',bp:''},
{id:32,n:'廖长奎',t:'县政府党组成员',b:'',bp:''},
{id:33,n:'薛运峰',t:'县政府党组成员',b:'',bp:''},
{id:100,n:'中共珙县县委',t:'org'},
{id:101,n:'珙县人民政府',t:'org'},
{id:102,n:'珙县人大常委会',t:'org'},
{id:103,n:'珙县政协',t:'org'},
{id:104,n:'珙县县委政法委',t:'org'},
{id:105,n:'珙县县委宣传部',t:'org'},
{id:106,n:'珙县县委统战部',t:'org'},
{id:107,n:'珙县公安局',t:'org'},
{id:108,n:'珙县人武部',t:'org'},
];

var edges = [
{from:1,to:100,title:'县委书记',dashes:true},
{from:2,to:100,title:'县委副书记',dashes:true},
{from:2,to:101,title:'县长',dashes:true},
{from:3,to:100,title:'专职副书记',dashes:true},
{from:4,to:104,title:'政法委书记',dashes:true},
{from:5,to:105,title:'宣传部部长',dashes:true},
{from:6,to:106,title:'统战部部长',dashes:true},
{from:7,to:101,title:'原常务副县长',dashes:true},
{from:8,to:101,title:'副县长',dashes:true},
{from:9,to:101,title:'副县长',dashes:true},
{from:10,to:107,title:'公安局长',dashes:true},
{from:10,to:101,title:'副县长',dashes:true},
{from:11,to:102,title:'主任',dashes:true},
{from:12,to:103,title:'主席',dashes:true},
{from:15,to:101,title:'常务副县长',dashes:true},
{from:19,to:105,title:'原宣传部长',dashes:true},
{from:20,to:101,title:'副县长',dashes:true},
{from:21,to:101,title:'副县长',dashes:true},
{from:22,to:108,title:'人武部长',dashes:true},
{from:23,to:102,title:'副主任',dashes:true},
{from:24,to:102,title:'副主任',dashes:true},
{from:25,to:102,title:'副主任',dashes:true},
{from:26,to:103,title:'副主席',dashes:true},
{from:27,to:103,title:'副主席',dashes:true},
{from:28,to:103,title:'副主席',dashes:true},
{from:29,to:101,title:'副县长',dashes:true},
{from:30,to:100,title:'县委常委',dashes:true},
{from:31,to:100,title:'县委常委',dashes:true},
{from:32,to:101,title:'党组成员',dashes:true},
{from:33,to:101,title:'党组成员',dashes:true},
{from:1,to:2,label:'正副搭档',title:'书记+县长搭档',color:'#c9a94e',width:3},
{from:1,to:3,label:'正副搭档',title:'书记+专职副书记',color:'#c9a94e',width:2},
{from:2,to:3,label:'同级',title:'县长+副书记',color:'#999',width:1.5},
{from:2,to:15,label:'上下级',title:'县长+常务副',color:'#c9a94e',width:2},
{from:2,to:8,label:'上下级',title:'县长+副县长',color:'#999',width:1},
{from:2,to:9,label:'上下级',title:'县长+副县长',color:'#999',width:1},
{from:2,to:10,label:'上下级',title:'县长+公安局长',color:'#999',width:1},
{from:2,to:20,label:'上下级',title:'县长+副县长',color:'#999',width:1},
{from:2,to:21,label:'上下级',title:'县长+副县长',color:'#999',width:1},
{from:2,to:29,label:'上下级',title:'县长+副县长',color:'#999',width:1},
{from:4,to:1,label:'下属',title:'政法委->书记',color:'#c9a94e',width:2},
{from:5,to:1,label:'下属',title:'宣传->书记',color:'#c9a94e',width:2},
{from:6,to:1,label:'下属',title:'统战->书记',color:'#c9a94e',width:2},
{from:15,to:1,label:'下属',title:'常务副->书记',color:'#c9a94e',width:2},
{from:4,to:5,title:'同为县委常委',color:'#666',width:0.5},
{from:4,to:6,title:'同为县委常委',color:'#666',width:0.5},
{from:5,to:6,title:'同为县委常委',color:'#666',width:0.5},
{from:19,to:5,label:'交接',title:'原->现任宣传部长',color:'#c89032',width:2,dashes:[5,5]},
{from:7,to:15,label:'交接',title:'常务副县长交接',color:'#c89032',width:2,dashes:[5,5]},
];

function color(t) {
if(t.indexOf('县委书记')>=0&&t.indexOf('副')<0) return '#c7a7a0';
if(t.indexOf('县长')>=0&&t.indexOf('副')<0) return '#3264c8';
if(t.indexOf('县委常委')>=0||t.indexOf('专职')>=0) return '#6478f0';
if(t.indexOf('副县长')>=0||t.indexOf('党组成员')>=0) return '#64b4f0';
if(t.indexOf('原')>=0||t.indexOf('原')>=0&&t.indexOf('副')>=0) return '#c89032';
return '#888';
}

var nodes = persons.map(function(p){
var isOrg=p.t==='org';
var info=[p.n];
if(p.b) info.push('出生：'+p.b);
if(p.bp) info.push('籍贯：'+p.bp);
if(!isOrg) info.push(p.t);
return {
id:p.id,label:p.n,title:info.join('<br>'),
shape:isOrg?'box':'dot',
size:isOrg?16:(p.id<=2?24:14),
color:isOrg?{background:'#333',border:'#555'}:{background:color(p.t),border:'#fff'},
font:{color:isOrg?'#777':'#eee',size:isOrg?10:13,strokeWidth:0},
mass:p.id<=2?2.5:1,
borderWidth:isOrg?1:2
};
});

var edgeData = edges.map(function(e){
return {
from:e.from,to:e.to,title:e.title||'',label:e.label||'',
color:e.color||'#444',width:e.width||1,dashes:e.dashes||false,
smooth:e.label?{type:'curvedCW',roundness:0.15}:{type:'continuous'}
};
});

var container=document.getElementById('graph');
var data={nodes:new vis.DataSet(nodes),edges:new vis.DataSet(edgeData)};
var options={
physics:{enabled:true,solver:'forceAtlas2Based',forceAtlas2Based:{gravitationalConstant:-80,centralGravity:0.005,springLength:180,springConstant:0.02,damping:0.4},stabilization:{iterations:150}},
interaction:{hover:true,tooltipDelay:150,zoomView:true,dragView:true},
edges:{smooth:true,font:{size:8,color:'#888',strokeWidth:0}},
nodes:{borderWidth:2}
};
new vis.Network(container,data,options);

var nc=nodes.length;
document.getElementById('nodeCount').textContent=nc;
document.getElementById('personCount').textContent=persons.filter(function(p){return p.t!=='org';}).length;
document.getElementById('edgeCount').textContent=edges.length;
document.getElementById('orgCount').textContent=nc-persons.filter(function(p){return p.t!=='org';}).length;
</script>
</body>
</html>
