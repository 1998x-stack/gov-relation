<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>忻州市领导班子关系网络图</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.2/vis-network.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0A0A0F; color: #E8E0D0; font-family: 'Inter', -apple-system, sans-serif; }
#mynetwork {
  width: 100%; height: 100vh;
  border: none;
}
.legend {
  position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
  background: rgba(10,10,15,0.9);
  border: 1px solid rgba(232,224,208,0.15);
  padding: 0.75rem 1.25rem;
  display: flex; gap: 1.5rem; flex-wrap: wrap; justify-content: center;
  backdrop-filter: blur(8px);
  z-index: 100;
  font-size: 0.78rem;
}
.legend-item { display: flex; align-items: center; gap: 0.4rem; }
.legend-dot {
  width: 0.65rem; height: 0.65rem; border-radius: 50%; flex-shrink: 0;
}
.legend-line {
  width: 1.2rem; height: 2px; flex-shrink: 0;
}
.title-bar {
  position: fixed; top: 0; left: 0; right: 0;
  background: rgba(10,10,15,0.85); backdrop-filter: blur(8px);
  border-bottom: 1px solid rgba(232,224,208,0.08);
  padding: 0.6rem 1.5rem;
  display: flex; justify-content: space-between; align-items: center;
  z-index: 100;
  font-size: 0.9rem;
}
.title-bar h1 { font-family: 'Noto Serif SC', serif; font-size: 1rem; font-weight: 600; }
.title-bar span { color: rgba(232,224,208,0.4); font-size: 0.75rem; }
</style>
</head>
<body>

<div class="title-bar">
  <h1>忻州市领导班子关系网络</h1>
  <span>2026年8月</span>
</div>

<div id="mynetwork"></div>

<div class="legend">
  <span class="legend-item"><span class="legend-dot" style="background:#E03C31;"></span> 市委</span>
  <span class="legend-item"><span class="legend-dot" style="background:#3273DC;"></span> 政府</span>
  <span class="legend-item"><span class="legend-dot" style="background:#FF9F00;"></span> 纪委</span>
  <span class="legend-item"><span class="legend-dot" style="background:#3ECF8E;"></span> 人大</span>
  <span class="legend-item"><span class="legend-dot" style="background:#D4A848;"></span> 政协</span>
  <span class="legend-item"><span class="legend-dot" style="background:#8899AA;"></span> 其他</span>
  <span class="legend-item"><span class="legend-dot" style="background:#888;width:0.5rem;height:0.5rem;"></span> 机构</span>
  <span class="legend-item"><span class="legend-line" style="width:1.2rem;height:2px;background:rgba(255,255,255,0.2);"></span> worked_at</span>
  <span class="legend-item"><span class="legend-line" style="width:1.2rem;height:2px;background:#C9A94E;"></span> 关系</span>
</div>

<script>
const nodes = new vis.DataSet([
  // Persons
  { id: "p1", label: "李建国\n市委书记", color: { background: "#E03C31", border: "#E03C31" }, size: 30, shape: "square", title: "李建国 · 市委书记 · 1972年生" },
  { id: "p2", label: "刘鹓\n市委副书记、市长", color: { background: "#E03C31", border: "#E03C31" }, size: 28, shape: "circle", title: "刘鹓 · 市委副书记、市长 · 新任" },
  { id: "p3", label: "温建军\n市委常委、副市长", color: { background: "#5075D0", border: "#5075D0" }, size: 22, shape: "triangle", title: "温建军 · 常务副市长" },
  { id: "p4", label: "张敏\n市委常委", color: { background: "#E03C31", border: "#E03C31" }, size: 18, shape: "triangle", title: "张敏 · 市委常委" },
  { id: "p5", label: "吴玉东\n市纪委书记", color: { background: "#FF9F00", border: "#FF9F00" }, size: 18, shape: "diamond", title: "吴玉东 · 市委常委、纪委书记" },
  { id: "p6", label: "邰三亲\n宣传部部长", color: { background: "#E03C31", border: "#E03C31" }, size: 18, shape: "triangle", title: "邰三亲 · 市委常委、宣传部部长" },
  { id: "p7", label: "史红波\n副市长、公安局长", color: { background: "#3278D0", border: "#3278D0" }, size: 18, shape: "triangle", title: "史红波 · 副市长、市公安局局长" },
  { id: "p8", label: "贾玲香\n副市长", color: { background: "#3278D0", border: "#3278D0" }, size: 18, shape: "triangle", title: "贾玲香 · 副市长· 民盟" },
  { id: "p9", label: "耿鹏鹏\n副市长", color: { background: "#3278D0", border: "#3278D0" }, size: 18, shape: "triangle", title: "耿鹏鹏 · 副市长" },
  { id: "p10", label: "崔峥岭\n副市长兼繁峙书记", color: { background: "#3278D0", border: "#3278D0" }, size: 18, shape: "triangle", title: "崔峥岭 · 副市长兼繁峙县委书记" },
  { id: "p11", label: "李硕\n副市长", color: { background: "#3278D0", border: "#3278D0" }, size: 18, shape: "triangle", title: "李硕 · 副市长 · 1982年生 · 回族" },
  { id: "p12", label: "王建江\n人大主任", color: { background: "#3ECF8E", border: "#3ECF8E" }, size: 20, shape: "square", title: "王建江 · 市人大常委会主任" },
  { id: "p13", label: "范建民\n政协主席", color: { background: "#D4A848", border: "#D4A848" }, size: 20, shape: "square", title: "范建民 · 市政协主席" },
  { id: "p14", label: "王月娥\n人大副主任", color: { background: "#3ECF8E", border: "#3ECF8E" }, size: 16, shape: "square", title: "王月娥 · 市人大常委会副主任" },
  { id: "p15", label: "王源\n政协领导", color: { background: "#D4A848", border: "#D4A848" }, size: 16, shape: "square", title: "王源 · 政协领导" },
  { id: "p16", label: "孙强\n市领导", color: { background: "#8899AA", border: "#8899AA" }, size: 16, shape: "triangle", title: "孙强 · 市领导" },
  { id: "p17", label: "吴瑞峰\n市领导", color: { background: "#8899AA", border: "#8899AA" }, size: 16, shape: "triangle", title: "吴瑞峰 · 市领导" },
  { id: "p18", label: "练建熙\n党组成员(挂职)", color: { background: "#8899AA", border: "#8899AA" }, size: 14, shape: "triangle", title: "练建熙 · 市政府党组成员 · 1981年生·博士·挂职" },
  { id: "p19", label: "张艮生\n市政府秘书长", color: { background: "#8899AA", border: "#8899AA" }, size: 14, shape: "triangle", title: "张艮生 · 市政府秘书长" },
  { id: "p20", label: "罗志宏\n市领导", color: { background: "#8899AA", border: "#8899AA" }, size: 14, shape: "triangle", title: "罗志宏 · 市领导" },
  { id: "p21", label: "李德刚\n市领导", color: { background: "#8899AA", border: "#8899AA" }, size: 14, shape: "triangle", title: "李德刚 · 市领导" },
  { id: "p22", label: "孟宏斌\n市领导", color: { background: "#8899AA", border: "#8899AA" }, size: 14, shape: "triangle", title: "孟宏斌 · 市领导" },
  { id: "p23", label: "石宝吉\n市领导", color: { background: "#8899AA", border: "#8899AA" }, size: 14, shape: "triangle", title: "石宝吉 · 市领导" },
  // Organizations
  { id: "o1", label: "中共忻州市委", color: { background: "#E03C31", border: "#8B2020" }, shape: "box", size: 12, title: "中共忻州市委" },
  { id: "o2", label: "忻州市人民政府", color: { background: "#3278D0", border: "#1B4F8A" }, shape: "box", size: 12, title: "忻州市人民政府" },
  { id: "o3", label: "市人大常委会", color: { background: "#3ECF8E", border: "#1B8A4A" }, shape: "box", size: 10, title: "忻州市人大常委会" },
  { id: "o4", label: "市政协", color: { background: "#D4A848", border: "#8A7028" }, shape: "box", size: 10, title: "忻州市政协" },
  { id: "o5", label: "市纪委监委", color: { background: "#FF9F00", border: "#BB7700" }, shape: "box", size: 10, title: "忻州市纪委监委" },
  { id: "o6", label: "市委宣传部", color: { background: "#E03C31", border: "#8B2020" }, shape: "box", size: 8, title: "忻州市委宣传部" },
  { id: "o7", label: "市公安局", color: { background: "#3278D0", border: "#1A4F8A" }, shape: "box", size: 8, title: "忻州市公安局" },
  { id: "o8", label: "繁峙县委", color: { background: "#E03C31", border: "#8B2020" }, shape: "box", size: 8, title: "繁峙县委" },
]);

const edges = new vis.DataSet([
  // Person → Organization
  { from: "p1", to: "o1", label: "书记", color: { color: "rgba(255,255,255,0.15)" }, width: 1 },
  { from: "p2", to: "o1", label: "副书记", color: { color: "rgba(255,255,255,0.15)" }, width: 1 },
  { from: "p2", to: "o2", label: "市长", color: { color: "rgba(255,255,255,0.15)" }, width: 1 },
  { from: "p3", to: "o1", label: "常委", color: { color: "rgba(255,255,255,0.15)" }, width: 1 },
  { from: "p3", to: "o2", label: "副市长", color: { color: "rgba(255,255,255,0.15)" }, width: 1 },
  { from: "p4", to: "o1", label: "常委", color: { color: "rgba(255,255,255,0.15)" }, width: 1 },
  { from: "p5", to: "o1", label: "常委", color: { color: "rgba(255,255,255,0.15)" }, width: 1 },
  { from: "p5", to: "o5", label: "纪委书记", color: { color: "rgba(255,255,255,0.15)" }, width: 1 },
  { from: "p6", to: "o1", label: "常委", color: { color: "rgba(255,255,255,0.15)" }, width: 1 },
  { from: "p6", to: "o6", label: "宣传部部长", color: { color: "rgba(255,255,255,0.15)" }, width: 1 },
  { from: "p7", to: "o2", label: "副市长", color: { color: "rgba(255,255,255,0.15)" }, width: 1 },
  { from: "p7", to: "o7", label: "公安局长", color: { color: "rgba(255,255,255,0.15)" }, width: 1 },
  { from: "p8", to: "o2", label: "副市长", color: { color: "rgba(255,255,255,0.15)" }, width: 1 },
  { from: "p9", to: "o2", label: "副市长", color: { color: "rgba(255,255,255,0.15)" }, width: 1 },
  { from: "p10", to: "o2", label: "副市长", color: { color: "rgba(255,255,255,0.15)" }, width: 1 },
  { from: "p10", to: "o8", label: "县委书记", color: { color: "rgba(255,255,255,0.15)" }, width: 1 },
  { from: "p11", to: "o2", label: "副市长", color: { color: "rgba(255,255,255,0.15)" }, width: 1 },
  { from: "p12", to: "o3", label: "主任", color: { color: "rgba(255,255,255,0.15)" }, width: 1 },
  { from: "p13", to: "o4", label: "主席", color: { color: "rgba(255,255,255,0.15)" }, width: 1 },
  { from: "p14", to: "o3", label: "副主任", color: { color: "rgba(255,255,255,0.15)" }, width: 1 },
  { from: "p15", to: "o4", label: "领导", color: { color: "rgba(255,255,255,0.15)" }, width: 1 },
  { from: "p18", to: "o2", label: "党组成员", color: { color: "rgba(255,255,255,0.15)" }, width: 1 },
  { from: "p19", to: "o2", label: "秘书长", color: { color: "rgba(255,255,255,0.15)" }, width: 1 },

  // Person ↔ Person relationships (gold edges)
  { id: "r1", from: "p1", to: "p2", color: { color: "#C9A94E" }, width: 3, title: "党政搭档", dashes: false },
  { from: "p1", to: "p3", color: { color: "#C9A94E", opacity: 0.6 }, width: 2, title: "上下级" },
  { from: "p1", to: "p12", color: { color: "#C9A94E", opacity: 0.5 }, width: 1.5, title: "四套班子" },
  { from: "p1", to: "p13", color: { color: "#C9A94E", opacity: 0.5 }, width: 1.5, title: "四套班子" },
  { from: "p1", to: "p5", color: { color: "#C9A94E", opacity: 0.4 }, width: 1.5, title: "上级纪委" },
  { from: "p1", to: "p6", color: { color: "#C9A94E", opacity: 0.4 }, width: 1.5, title: "上级宣传" },
  { from: "p2", to: "p12", color: { color: "#C9A94E", opacity: 0.3 }, width: 1.5, title: "四套班子" },
  { from: "p2", to: "p13", color: { color: "#C9A94E", opacity: 0.3 }, width: 1.5, title: "四套班子" },
  { from: "p2", to: "p3", color: { color: "#C9A94E", opacity: 0.6 }, width: 2, title: "政府搭档" },
  { from: "p3", to: "p7", color: { color: "#C9A94E", opacity: 0.4 }, width: 1.5, title: "政府同僚" },
  { from: "p3", to: "p11", color: { color: "#C9A94E", opacity: 0.4 }, width: 1.5, title: "政府同僚" },
  { from: "p11", to: "p18", color: { color: "#C9A94E", opacity: 0.6 }, width: 2, title: "同批调入(80后)" },
]);

const container = document.getElementById('mynetwork');
const data = { nodes, edges };
const options = {
  nodes: {
    font: { color: '#E8E0D0', size: 12, face: 'Inter, sans-serif' },
    borderWidth: 0,
    size: 15,
    opacity: 0.9,
  },
  edges: {
    smooth: { type: 'continuous' },
    font: { color: 'rgba(232,224,208,0.4)', size: 9, strokeWidth: 0 },
  },
  physics: {
    solver: 'forceAtlas2Based',
    forceAtlas2Based: {
      gravitationalConstant: -40,
      centralGravity: 0.008,
      springLength: 180,
      springConstant: 0.02,
      damping: 0.4,
    },
    stabilize: true,
    adaptiveTimestep: true,
  },
  interaction: {
    hover: true,
    tooltipDelay: 200,
    multiselect: true,
  },
  groups: {
    person: { shape: 'dot' },
    org: { shape: 'box' },
  },
};

const network = new vis.Network(container, data, options);
</script>
</body>
</html>
