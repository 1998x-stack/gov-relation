services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${GOV_RELATION_POSTGRES_DB:-gov_relation}
      POSTGRES_USER: ${GOV_RELATION_POSTGRES_USER:-gov_relation}
      POSTGRES_PASSWORD: ${GOV_RELATION_POSTGRES_PASSWORD:-gov_relation_dev_only}
    ports:
      - "127.0.0.1:${GOV_RELATION_POSTGRES_PORT:-55439}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - gov_relation_postgres_data:/var/lib/postgresql/data
      - ../../migrations/postgres:/migrations:ro

volumes:
  gov_relation_postgres_data:
