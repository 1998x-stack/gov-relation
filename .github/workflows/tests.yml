name: Python tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install pytest

      # scripts/build/legacy contains pre-existing invalid generated scripts;
      # those require a separate migration and must not mask current-code tests.
      - name: Compile maintained application and test modules
        run: python -m compileall -q gov_relation scripts/gov2.py scripts/govdb.py scripts/serve_app.py tests

      - name: Run test suite
        run: python -m pytest tests/ -q
